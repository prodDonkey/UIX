# UIX 生产部署编排
# 用法见 docker/README.md
name: uix

services:
  backend-ts:
    build:
      context: ./backend-ts
      dockerfile: Dockerfile
    image: uix-backend-ts:latest
    # .env 提供 DATABASE_URL / LLM_* / MIDSCENE_* 等(config.ts 会自动把
    # mysql+pymysql:// 前缀转成 mysql://)
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      # 设备选择遵循 Midscene 机制(脚本 android.deviceId > MIDSCENE_ANDROID_DEVICE_ID > 自动选)。
      # 云真机:先占用设备拿到 connectCmd,再 docker compose exec backend-ts adb connect <addr>。
      MIDSCENE_ANDROID_DEVICE_ID: "${MIDSCENE_ANDROID_DEVICE_ID:-}"
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: uix-frontend:latest
    environment:
      # 留空 => 前端走相对路径 /api,由本容器 nginx 反代到 backend-ts(同域名免 CORS)
      API_BASE_URL: "${FRONTEND_API_BASE_URL:-}"
      ANDROID_PLAYGROUND_URL: "${VITE_ANDROID_PLAYGROUND_URL:-}"
      # nginx 反代上游
      BACKEND_UPSTREAM: "backend-ts:8001"
    ports:
      - "8080:80"
    depends_on:
      - backend-ts
    restart: unless-stopped
